name: digestabot

on:
  workflow_dispatch:

jobs:
  update-digests:
    # Only the repository owner can run this workflow
    if: github.actor == 'javiertuya'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The push done by digestabot reuses the checkout credentials, so the PAT is needed here too
          token: ${{ secrets.DIGESTABOT_TOKEN }}
      - uses: docker/login-action@v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN_WRONG }}  # TEMPORARY: forces a login failure
      - uses: chainguard-dev/digestabot@v1.3.2
        with:
          token: ${{ secrets.DIGESTABOT_TOKEN }}
          working-dir: dockerfiles
          include-files: Dockerfile*
          use-gitsign: 'false'
          branch-for-pr: digestabot/docker/XXX
          title-for-pr: Update Docker image digests for XXX
          commit-message: Update Docker image digests for XXX
          labels-for-pr: dependencies, docker
          description-for-pr: |
            Refreshes the pinned digest of the `XXX` base image in `dockerfiles/Dockerfile.XXX`.

            The tag is unchanged: the registry now serves a different image behind it (e.g. a rebuilt base OS). The diff shows the previous and the new digest.

            Generated by [digestabot](https://github.com/chainguard-dev/digestabot).
      # digestabot only logs the images it cannot resolve (e.g. registry without login) and
      # does not detect stale tags in the released version, so both are checked here with crane
      - name: Check that all images can be resolved and are not stale
        env:
          STALE_AFTER_DAYS: 30
        run: |
          crane() {
            docker run --rm -e DOCKER_CONFIG=/dc -v "$HOME/.docker:/dc:ro"               gcr.io/go-containerregistry/crane:latest "$@"
          }
          failed=0
          while read -r ref; do
            image="${ref%%@*}"
            if ! crane digest "$image" > /dev/null 2>&1; then
              echo "::error::Cannot retrieve the digest of $image"
              failed=1
              continue
            fi
            # Build time: manifest annotation, or the config of the amd64 image as a fallback
            created=$(crane manifest "$image" 2>/dev/null | jq -r '.annotations["org.opencontainers.image.created"] // empty')
            [ -n "$created" ] || created=$(crane config --platform linux/amd64 "$image" 2>/dev/null | jq -r '.created // empty')
            if [ -z "$created" ]; then
              echo "::notice::Cannot determine the build date of $image, skipping the stale check"
              continue
            fi
            age=$(( ($(date +%s) - $(date -d "$created" +%s)) / 86400 ))
            if [ "$age" -gt "$STALE_AFTER_DAYS" ]; then
              echo "::error::Stale image $image: last built on ${created%%T*} ($age days ago, limit $STALE_AFTER_DAYS)"
              failed=1
            fi
          done < <(grep -rhoE --include='Dockerfile*' '[^[:space:]="]+@sha256:[a-f0-9]{64}' dockerfiles)
          exit $failed
