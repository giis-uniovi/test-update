name: digestabot

on:
  workflow_dispatch:
    inputs:
      auto-merge:
        type: boolean
        default: false
      merge-method:
        type: string
        default: squash
      stale-days:
        type: number
        default: 365

jobs:
  update-digests:
    # Only the repository owner can run this workflow
    if: github.actor == 'javiertuya'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: javiertuya/digestabot-workflows/.github/workflows/docker-digests.yml@auto-merge
    with:
      image-name: XXX
      dhi-login: true
      assignee: javiertuya
      auto-merge: ${{ inputs.auto-merge }}
      merge-method: ${{ inputs.merge-method }}
      stale-days: ${{ inputs.stale-days }}
    secrets:
      DIGESTABOT_TOKEN: ${{ secrets.DIGESTABOT_TOKEN }}
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
