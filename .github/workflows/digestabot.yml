name: digestabot

on:
  workflow_dispatch:

jobs:
  update-digests:
    # Only the repository owner can run this workflow
    if: github.actor == 'javiertuya'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The push done by digestabot reuses the checkout credentials, so the PAT is needed here too
          token: ${{ secrets.DIGESTABOT_TOKEN }}
      - uses: docker/login-action@v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - uses: chainguard-dev/digestabot@v1.3.2
        with:
          token: ${{ secrets.DIGESTABOT_TOKEN }}
          working-dir: dockerfiles
          include-files: Dockerfile*
          use-gitsign: 'false'
          branch-for-pr: digestabot/docker/XXX
          title-for-pr: Update Docker image digests for XXX
          commit-message: Update Docker image digests for XXX
          labels-for-pr: dependencies, docker
          description-for-pr: |
            Refreshes the pinned digest of the `XXX` base image in `dockerfiles/Dockerfile.XXX`.

            The tag is unchanged: the registry now serves a different image behind it (e.g. a rebuilt base OS). The diff shows the previous and the new digest.

            Generated by [digestabot](https://github.com/chainguard-dev/digestabot).
      # digestabot only logs the images it cannot resolve (e.g. registry without login) and
      # still succeeds, so check them here to make the job fail (uses crane, as digestabot does)
      - name: Check that all image digests can be resolved
        run: |
          failed=0
          while read -r ref; do
            image="${ref%%@*}"
            if ! docker run --rm -e DOCKER_CONFIG=/dc -v "$HOME/.docker:/dc:ro" \
                gcr.io/go-containerregistry/crane:latest digest "$image" > /dev/null 2>&1; then
              echo "::error::Cannot retrieve the digest of $image"
              failed=1
            fi
          done < <(grep -rhoE --include='Dockerfile*' '[^[:space:]="]+@sha256:[a-f0-9]{64}' dockerfiles)
          exit $failed
