name: digestabot

on:
  workflow_dispatch:

jobs:
  update-digests:
    # Only the repository owner can run this workflow
    if: github.actor == 'javiertuya'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/digestabot-reusable.yml
    with:
      image-name: XXX
      dhi-login: true
    secrets:
      DIGESTABOT_TOKEN: ${{ secrets.DIGESTABOT_TOKEN }}
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
